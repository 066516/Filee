build:
  - changed-files:
      - any-glob-to-any-file:
          - build/**
          - installer/**
          - global.json

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**

documentation:
  - changed-files:
      - all-globs-to-all-files:
          - "{docs/**,**/*.md}"

formats:
  - changed-files:
      - any-glob-to-any-file:
          - src/Filee.Engines/**

translation:
  - changed-files:
      - all-globs-to-all-files:
          - src/Filee.App/Assets/i18n/**
